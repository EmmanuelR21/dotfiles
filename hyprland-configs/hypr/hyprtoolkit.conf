# Shared theme for hyprtoolkit apps (hyprlauncher, etc.)
# Palette follows hyprland.lua: active border #999999, inactive #595959, shadow #1a1a1a

# Surfaces
background     = rgb(1a1a1a)
base           = rgb(212121)
alternate_base = rgb(262626)

# Text
text        = rgb(d9d9d9)
bright_text = rgb(ffffff)
link_text   = rgb(bfbfbf)

# Accents (match active / inactive borders)
accent           = rgb(999999)
accent_secondary = rgb(595959)

# Square corners, like the windows
rounding_large = 0
rounding_small = 0

# Fonts
font_family           = Adwaita Sans
font_family_monospace = Adwaita Mono
font_size             = 12
small_font_size       = 10

icon_theme = breeze-dark
