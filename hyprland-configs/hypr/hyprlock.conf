# Palette follows hyprland.lua: active border #999999, inactive #595959, shadow #1a1a1a
$accent   = rgba(999999ff)

$surface  = rgba(1a1a1acc)
$text     = rgb(d9d9d9)
$font     = Adwaita Sans

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = snap, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3.5, snap
    animation = fadeOut, 1, 2.5, snap
    animation = inputFieldDots, 1, 2, snap
}

background {
    monitor =
    path = ~/Pictures/wallpapers/selected/lockscreen.png
    color = rgba(1a1a1aff)
    blur_passes = 2
    blur_size = 5
    brightness = 0.7
    contrast = 0.9
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = $TIME12
    color = $text
    font_size = 96
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(bfbfbfff)
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 0

    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = $font

    check_color = rgba(d9d9d9ff)
    fail_color = rgba(c86464ff)
    capslock_color = rgba(c8a064ff)

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false
    placeholder_text = <span foreground="##808080">password</span>
    fail_text = <span foreground="##c86464">$FAIL ($ATTEMPTS)</span>

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -40
    halign = center
    valign = center
}
