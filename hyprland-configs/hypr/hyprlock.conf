# Palette follows hyprland.lua: active border #999999, inactive #595959, shadow #1a1a1a
$accent   = rgba(999999ff)

$surface  = rgba(1a1a1acc)
$text     = rgb(d9d9d9)
$font     = Adwaita Sans

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = snap, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3.5, snap
    animation = fadeOut, 1, 2.5, snap
    animation = inputFieldDots, 1, 2, snap
}

background {
    monitor =
    path = ~/Pictures/wallpapers/selected/lockscreen.png
    color = rgba(1a1a1aff)
    blur_passes = 2
    blur_size = 5
    brightness = 0.7
    contrast = 0.9
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = $TIME12
    color = $text
    font_size = 96
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(bfbfbfff)
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 110
    halign = center
    valign = center
}

# Battery: icon + percentage (+ status when plugged in), between the date and the password field
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/hyprlock-battery.sh
    color = rgba(bfbfbfff)
    font_size = 16
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 0

    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = $font

    check_color = rgba(d9d9d9ff)
    fail_color = rgba(c86464ff)
    capslock_color = rgba(c8a064ff)

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    fade_on_empty = false
    placeholder_text = <span foreground="##808080">password</span>
    fail_text = <span foreground="##c86464">$FAIL ($ATTEMPTS)</span>

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -40
    halign = center
    valign = center
}

# Fingerprint icon: eased gray pulse while waiting; on a fingerprint failure it turns red
# and does a damped shake (an invisible spacer glyph, sized along a sine curve, nudges the
# centered icon left/right). Once fingerprint auth is disabled it stays dim red and still.
# State (hyprlock pid, last attempt count, fail time in ms) is kept in $XDG_RUNTIME_DIR/hyprlock-fp.
label {
    monitor =
    text = cmd[update:33] s=$XDG_RUNTIME_DIR/hyprlock-fp; n=$(date +%s%3N); a=$ATTEMPTS; pid=; la=0; ft=0; [ -f $s ] && read pid la ft < $s; [ "$pid" = "$PPID" ] || { la=0; ft=0; }; case "$FAIL" in Fingerprint*) [ $a -gt $la ] && ft=$n ;; esac; echo "$PPID $a $ft" > $s; e=$((n-ft)); p=''; q=''; o=''; if [ $e -lt 1500 ]; then c=c86464; if [ $e -lt 600 ]; then h=$((e%75*1000/75)); w=$((10240*(600-e)/600*16*h*(1000-h)/(5000000-4*h*(1000-h)))); if [ $w -gt 200 ]; then g="<span alpha='1' size='$w'>󰈷</span>"; if [ $((e/75%2)) -eq 0 ]; then p=$g; else q=$g; fi; fi; fi; else case "$FPRINTFAIL" in *disabled*|*disconnected*) c=c86464; o=" alpha='45%'" ;; *) t=$((n%2400)); [ $t -gt 1200 ] && t=$((2400-t)); t=$((t*1000/1200)); t=$((t*t*(3000-2*t)/1000000)); l=$((89+128*t/1000)); c=$(printf '%02x%02x%02x' $l $l $l) ;; esac; fi; echo "$p<span foreground='##$c'$o>󰈷</span>$q"
    font_size = 28
    font_family = Symbols Nerd Font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -115
    halign = center
    valign = center
}

# Fingerprint status (ready / scanning / retry messages; explains when fingerprint is disabled)
label {
    monitor =
    text = cmd[update:250] case "$FPRINTFAIL" in *attempts*) echo "<span foreground='##c86464'>Too many attempts, use your password</span>" ;; *disabled*|*disconnected*) echo "<span foreground='##c86464'>Fingerprint unavailable, use your password</span>" ;; *) echo "$FPRINTPROMPT" ;; esac
    color = rgba(bfbfbfff)
    font_size = 14
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, -160
    halign = center
    valign = center
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Scanning...
}
