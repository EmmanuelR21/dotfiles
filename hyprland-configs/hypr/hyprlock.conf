background {
    monitor = eDP-1
    path = ~/Pictures/wallpapers/night_gas_station.png
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2

    outer_color = rgba(ffffffff) 
    inner_color = rgba(2f2f2fff) 

    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

		placeholder_text = Password

    font_color = rgb(ffffff)
    fade_on_empty = false
    rounding = 0 

    position = 0, 0
    halign = center
    valign = center
}
